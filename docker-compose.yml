services:
web:
build: .
env_file: .env
depends_on: [db]
ports: ["8000:8000"]
volumes:
- media_data:/data/uploads
db:
image: postgres:16
environment:
POSTGRES_DB: microblog
POSTGRES_USER: postgres
POSTGRES_PASSWORD: postgres
ports: ["5432:5432"]
volumes:
- pg_data:/var/lib/postgresql/data
volumes:
pg_data:
media_data: