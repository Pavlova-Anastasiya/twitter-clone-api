[tool.poetry]
name = "microblog"
version = "0.1.0"
description = "Corporate microblog backend (FastAPI + SQLAlchemy + Alembic)"
authors = ["Anastasiya <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
pydantic = "^2.8.2"
SQLAlchemy = "^2.0.36"
alembic = "^1.13.2"
psycopg = {version="^3.2.1", extras=["binary"]}
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-cov = "^5.0.0"
httpx = "^0.27.2"
mypy = "^1.11.1"
ruff = "^0.6.9"
